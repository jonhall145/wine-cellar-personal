name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release'
        required: true
        default: 'minor'
        type: choice
        options:
          - minor
          - major
          - rc

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip bump commits pushed by this workflow to avoid infinite loop
    if: |
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'bump:')
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.PAT }}

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Commitizen
        run: pip install commitizen

      - name: Determine bump type
        id: bump_type
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "type=patch" >> $GITHUB_OUTPUT
          else
            echo "type=${{ github.event.inputs.release_type }}" >> $GITHUB_OUTPUT
          fi

      - name: Bump version and update changelog
        id: bump
        run: |
          set -e
          TYPE="${{ steps.bump_type.outputs.type }}"

          if [ "$TYPE" == "rc" ]; then
            NEXT_VERSION=$(cz bump --get-next -pr rc)
            cz bump --yes -pr rc
          elif [ "$TYPE" == "minor" ]; then
            NEXT_VERSION=$(cz bump --get-next --increment MINOR)
            cz bump --yes --increment MINOR
          elif [ "$TYPE" == "major" ]; then
            NEXT_VERSION=$(cz bump --get-next --increment MAJOR)
            cz bump --yes --increment MAJOR
          else
            NEXT_VERSION=$(cz bump --get-next --increment PATCH)
            cz bump --yes --increment PATCH
          fi

          cz changelog
          git add CHANGELOG.md
          git commit --amend --no-edit
          git tag -d "$NEXT_VERSION"
          git tag "$NEXT_VERSION"
          echo "NEW_VERSION=$NEXT_VERSION" >> $GITHUB_OUTPUT

      - name: Push commit and tag
        run: |
          git push
          git push --tags

      - name: Summary
        env:
          NEW_VERSION: ${{ steps.bump.outputs.NEW_VERSION }}
        run: echo "Released $NEW_VERSION"
