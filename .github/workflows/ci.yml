name: Django CI

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  precheck:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      should_run: ${{ steps.should_run.outputs.should_run }}
    steps:
      - name: Check for commits since previous success
        id: should_run
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: context.workflow,
              branch: 'main',
              status: 'completed',
              per_page: 100
            });
            const lastSuccess = runs.data.workflow_runs.find(
              (run) => run.conclusion === 'success'
            );
            const shouldRun = !lastSuccess || lastSuccess.head_sha !== context.sha;
            core.setOutput('should_run', shouldRun ? 'true' : 'false');

  build:
    needs: precheck
    if: needs.precheck.outputs.should_run == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
      - name: Setup Postgres
        env:
          PGPASSWORD: postgres
          PGHOSTADDR: 127.0.0.1
        run: |
          psql -c 'create database django;' -U postgres
          psql -c 'create database django_test;' -U postgres
      - name: Cache node modules
        uses: actions/cache@v5
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: Cache pip packages
        uses: actions/cache@v5
        env:
          cache-name: cache-pip-packages
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/requirements/dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: Install Dependencies
        run: |
          npm install
          npm run build
          pip install -r requirements/dev.txt
      - name: Run Tests
        env:
          PGPASSWORD: postgres
          PGHOSTADDR: 127.0.0.1
        run: |
          python manage.py collectstatic > /dev/null
          py.test --cov
          isort --diff -c wine_cellar tests
          python manage.py makemigrations --dry-run --check --noinput
          flake8 wine_cellar tests --exclude migrations,settings
      - name: Coveralls
        uses: coverallsapp/github-action@v2
