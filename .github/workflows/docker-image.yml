name: Docker Image CI

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  precheck:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.should_run.outputs.should_run }}
    steps:
      - name: Check for commits since previous success
        id: should_run
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: context.workflow,
              branch: 'main',
              status: 'completed',
              per_page: 50
            });
            const lastSuccess = runs.data.workflow_runs.find(
              (run) => run.id !== context.runId && run.conclusion === 'success'
            );
            const shouldRun = !lastSuccess || lastSuccess.head_sha !== context.sha;
            core.setOutput('should_run', shouldRun ? 'true' : 'false');
  build:
    needs: precheck
    if: needs.precheck.outputs.should_run == 'true'

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)
