name: Docker Image CI

on:
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  precheck:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.should_run.outputs.should_run }}
    steps:
      - name: Check for commits since previous success
        id: should_run
        uses: actions/github-script@v8
        with:
          script: |
            if (context.eventName === 'pull_request') {
              core.setOutput('should_run', 'true');
              return;
            }
            const { owner, repo } = context.repo;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'docker-image.yml',
              branch: 'main',
              status: 'completed',
              per_page: 100
            });
            const lastSuccess = runs.data.workflow_runs.find(
              (run) => run.conclusion === 'success'
            );
            if (!lastSuccess) {
              core.info('No successful completed runs found in the last 100; running build.');
            }
            const shouldRun = !lastSuccess || lastSuccess.head_sha !== context.sha;
            core.setOutput('should_run', shouldRun ? 'true' : 'false');
  build:
    needs: precheck
    if: needs.precheck.outputs.should_run == 'true'

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)
