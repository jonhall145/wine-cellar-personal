services:
  web:
    build:
      context: .
      args:
        REQUIREMENTS_FILE: requirements/docker.txt
    image: wine-cellar:dev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./wine_cellar:/app/wine_cellar
      - ./tests:/app/tests
      - ./fixtures:/app/fixtures
      - ./manage.py:/app/manage.py
      - media_data:/app/media
    ports:
      - "8003:8000"
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-django_dev}
      POSTGRES_USER: ${POSTGRES_USER:-django_dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-django_dev_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-django_dev_user} -d $${POSTGRES_DB:-django_dev}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  media_data:
