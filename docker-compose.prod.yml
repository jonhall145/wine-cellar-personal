services:
  wine-web:
    build:
      context: .
      target: local
      args:
        REQUIREMENTS_FILE: requirements/prod.txt
    image: wine-cellar:prod
    command: gunicorn wine_cellar.conf.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120 --worker-class sync
    expose:
      - "8000"
    env_file:
      - .env.docker.prod
    volumes:
      - /mnt/usb/media/wine:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  whisky-web:
    image: wine-cellar:prod
    command: gunicorn wine_cellar.conf.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120 --worker-class sync
    expose:
      - "8000"
    env_file:
      - .env.whisky.docker.prod
    volumes:
      - /mnt/usb/media/whisky:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
      - "8000:80"
      - "8004:81"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - static_data:/app/staticfiles:ro
      - /mnt/usb/media/wine:/app/media:ro
      - /mnt/usb/media/whisky:/app/whisky_media:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - wine-web
      - whisky-web
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    env_file:
      - .env.docker.prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_prod_data:
  static_data:
  redis_data:
