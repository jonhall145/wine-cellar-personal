site_name: Wine Cellar Documentation
nav:
  - Home: README.md
  - Getting Started: deployment.md
  - Development:
    - Setup: setup.md
    - Testing: testing.md
  - Database:
    - Models: models.md
  - Features:
    - Wine Management: wine.md
    - Storage: storage.md
    - Vision-Based Entry: vision-wine-entry.md
  - AI Skills:
    - UI Testing with Playwright: skills/ui-testing-playwright.md
    - CSS Debugging: skills/css-debugging.md
    - Empty State Patterns: skills/empty-state-patterns.md
    - Django Test Users: skills/django-test-users.md
    - Fixing Console Errors: skills/fixing-console-errors.md

theme:
  name: material
  logo: logo.svg
  favicon: logo.svg

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
