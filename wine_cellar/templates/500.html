<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error - Wine Cellar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-page {
            text-align: center;
            max-width: 500px;
        }
        .error-page__code {
            font-size: 8rem;
            font-weight: 700;
            color: #722f37;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin-bottom: 0.5rem;
        }
        .error-page__title {
            font-size: 1.75rem;
            margin-bottom: 1rem;
            color: #f0f0f0;
        }
        .error-page__message {
            font-size: 1rem;
            color: #b0b0b0;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .button {
            display: inline-block;
            padding: 12px 24px;
            background: #722f37;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            transition: background 0.2s;
        }
        .button:hover {
            background: #8b3a43;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <h1 class="error-page__code">500</h1>
        <h2 class="error-page__title">Server Error</h2>
        <p class="error-page__message">
            Something went wrong on our end. We've been notified and are working to fix it.
            Please try again in a few moments.
        </p>
        {# djlint:off D018 #}
        <a href="/" class="button">Return to Homepage</a>
        {# djlint:on #}
    </div>
</body>
</html>
