{% load static i18n %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#019603">
        <title>{% translate "Offline" %}</title>
        <style>
            :root {
                --primary: #019603;
            }
            * { margin: 0; padding: 0; box-sizing: border-box; }
            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                background: #f7f7f7;
                color: #333;
                padding: 1rem;
            }
            .offline-container {
                text-align: center;
                max-width: 400px;
            }
            .offline-icon {
                font-size: 4rem;
                margin-bottom: 1rem;
            }
            h1 {
                font-size: 1.5rem;
                margin-bottom: 0.5rem;
                color: var(--primary);
            }
            p {
                color: #666;
                margin-bottom: 1.5rem;
                line-height: 1.5;
            }
            .retry-btn {
                display: inline-block;
                padding: 0.75rem 1.5rem;
                background: var(--primary);
                color: #fff;
                border: none;
                border-radius: 4px;
                font-size: 1rem;
                cursor: pointer;
                text-decoration: none;
            }
            .retry-btn:hover { opacity: 0.9; }
        </style>
    </head>
    <body>
        <div class="offline-container">
            <div class="offline-icon">📡</div>
            <h1>{% translate "You're offline" %}</h1>
            <p>{% translate "It looks like you've lost your internet connection. Please check your connection and try again." %}</p>
            <button class="retry-btn" onclick="window.location.reload()">{% translate "Try again" %}</button>
        </div>
    </body>
</html>
