{% extends 'base.html' %}
{% load static %}
{% block title %}
    Add to Wishlist
{% endblock title %}
{% block header %}
    <h1 class="header__title">Add to Wishlist</h1>
{% endblock header %}
{% block content %}
    <div class="pure-g">
        <div class="pure-u-1 pure-u-lg-1-3 m-auto">
            <form method="post"
                  class="pure-form pure-form-stacked wine-form"
                  novalidate>
                {% csrf_token %}
                {% for field in form %}
                    {% include 'forms/form_field.html' %}
                {% endfor %}
                <div class="pure-controls">
                    <button type="submit"
                            class="pure-button button__secondary">Save</button>
                </div>
            </form>
        </div>
    </div>
{% endblock content %}
