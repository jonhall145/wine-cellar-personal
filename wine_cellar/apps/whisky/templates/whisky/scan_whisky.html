{% extends 'base.html' %}
{% load static %}
{% block header %}
    <h1 class="header__title">Scan Barcode</h1>
{% endblock header %}
{% block content %}
    <div class="pure-g">
        <div class="pure-u-1-1 pure-u-sm-1-3 m-auto">
            <p class="form-hint">
                Scan the barcode of a bottle to quickly add or remove a whisky from your cabinet.
            </p>
            <div id="scanner" data-zxing-wasm-url="{% static 'zxing_reader.wasm' %}" data-scan-url="/whisky/scanned/__CODE__/" data-scan-barcode-url="{% url 'whisky-scan-barcode' %}" data-label-scan-url="{% url 'label-scan' %}"></div>
        </div>
    </div>
{% endblock content %}
{% block extra_js %}
    <script src="{% static 'react-vendors.js' %}"></script>
    <script src="{% static 'barcode_scanner.js' %}"></script>
{% endblock extra_js %}
