{% extends 'base.html' %}
{% load static i18n %}
{% block header %}
    <h1 class="header__title">{% translate "Distillery Map" %}</h1>
{% endblock header %}
{% block styles %}
    {{ block.super }}
    <link rel="stylesheet" href="{% static 'leaflet-vendors.css' %}" />
    <link rel="stylesheet" href="{% static 'distillery_map.css' %}" />
{% endblock styles %}
{% block content %}
    <div class="pure-g">
        <div class="pure-u-1-1 m-auto">
            <div id="distillery-map" data-distilleries='{{ distilleries_json }}' data-base-url="{{ map_base_url }}"></div>
        </div>
    </div>
{% endblock content %}
{% block extra_js %}
    <script src="{% static 'react-vendors.js' %}" defer></script>
    <script src="{% static 'leaflet-vendors.js' %}" defer></script>
    <script src="{% static 'distillery_map.js' %}" defer></script>
{% endblock extra_js %}
