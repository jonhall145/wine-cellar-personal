{% extends 'base.html' %}
{% load static react_maps_tags %}
{% block header %}
    <h1 class="header__title">Map of your wines</h1>
{% endblock header %}
{% block styles %}
    {{ block.super }}
    <link rel="stylesheet" href="{% static 'leaflet-vendors.css' %}" />
    <link rel="stylesheet" href="{% static 'maps.css' %}" />
{% endblock styles %}
{% block content %}
    <div class="pure-g">
        <div class="pure-u-1-1 m-auto">{% react_map wines %}</div>
    </div>
{% endblock content %}
{% block extra_js %}
    <script src="{% static 'react-vendors.js' %}" defer></script>
    <script src="{% static 'leaflet-vendors.js' %}" defer></script>
    <script src="{% static 'maps.js' %}" defer></script>
{% endblock extra_js %}
