{% extends 'base.html' %}
{% block title %}
    Delete Wishlist Item
{% endblock title %}
{% block header %}
    <h1 class="header__title">Delete Wishlist Item</h1>
{% endblock header %}
{% block content %}
    <div class="pure-g">
        <div class="pure-u-1 pure-u-lg-1-3 m-auto">
            <form method="post" class="pure-form pure-form-stacked">
                {% csrf_token %}
                <p>Are you sure you want to delete "{{ object.name }}" from your wishlist?</p>
                <div class="pure-controls">
                    <button type="submit"
                            class="pure-button button__danger">Delete</button>
                    <a href="{% url 'wishlist-list' %}"
                       class="pure-button">Cancel</a>
                </div>
            </form>
        </div>
    </div>
{% endblock content %}
